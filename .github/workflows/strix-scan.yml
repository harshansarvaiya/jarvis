name: Strix DAST Scan

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Target directory or route to audit'
        required: false
        default: 'app/api'

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and Strix Agent
        run: |
          pip install uv
          uv pip install --system strix-agent

      - name: Run Strix Scan (Non-Interactive)
        run: |
          strix --target ${{ github.event.inputs.target_path || 'app/api' }} --mode quick --non-interactive
        env:
          STRIX_LLM: 'gemini/gemini-2.0-flash'
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

