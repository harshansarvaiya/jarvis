name: Strix DAST Scan

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Target directory or route to audit'
        required: false
        default: 'app/api'
      model:
        description: 'LLM Model to power Strix (e.g. gemini/gemini-3.7-flash, gemini/gemini-3.6-flash)'
        required: false
        default: 'gemini/gemini-3.7-flash'

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv and Strix Agent
        run: |
          pip install uv
          uv pip install --system strix-agent

      - name: Run Strix Scan (Non-Interactive)
        run: |
          strix -t ${{ github.event.inputs.target_path || 'app/api' }} -m quick -n
        env:
          STRIX_LLM: ${{ github.event.inputs.model || 'gemini/gemini-3.7-flash' }}
          LLM_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GEMINI_API_KEY }}

