name: Strix DAST Scan

on:
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Target directory or route to audit'
        required: false
        default: 'app/api'

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv and Strix
        run: |
          pip install uv
          uv pip install --system usestrix

      - name: Run Strix Scan (Free Tier Provider)
        run: |
          strix --model gemini/gemini-2.0-flash --api-key ${{ secrets.STRIX_API_KEY }} ${{ github.event.inputs.target_path }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
