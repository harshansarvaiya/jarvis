name: Strix DAST Scan

on:
  workflow_dispatch:

jobs:
  strix-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install Strix and dependencies
        run: uv pip install usestrix

      - name: Run Strix Scan
        run: strix --api-key ${{ secrets.STRIX_API_KEY }} --app-id ${{ secrets.STRIX_APP_ID }} .
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}